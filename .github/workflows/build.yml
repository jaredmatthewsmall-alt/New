name: Build apps

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LiveSoundAnalyzer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSoundAnalyzer-windows
          path: dist/LiveSoundAnalyzer.exe

  macos:
    runs-on: macos-latest   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build app bundle
        run: |
          python -m PyInstaller --noconfirm --clean LiveSoundAnalyzer.spec
          codesign --force --deep --sign - "dist/Live Sound Analyzer.app"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            "dist/Live Sound Analyzer.app/Contents/Info.plist"
          ditto -c -k --keepParent "dist/Live Sound Analyzer.app" \
            dist/LiveSoundAnalyzer-macOS-arm64.zip
      - name: Smoke test (app starts and keeps running)
        run: |
          "dist/Live Sound Analyzer.app/Contents/MacOS/LiveSoundAnalyzer" --demo &
          PID=$!
          sleep 15
          kill -0 $PID   # fails the job if the app crashed on startup
          kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSoundAnalyzer-macOS-arm64
          path: dist/LiveSoundAnalyzer-macOS-arm64.zip

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        run: swift test --package-path LiveSoundCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project LiveSoundAnalyzer.xcodeproj -scheme LiveSoundAnalyzer \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild -project LiveSoundAnalyzer.xcodeproj -scheme LiveSoundAnalyzer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package unsigned .ipa (for sideloading from Windows with Sideloadly/AltStore)
        run: |
          APP=build-device/Build/Products/Release-iphoneos/LiveSoundAnalyzer.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ../LiveSoundAnalyzer-unsigned.ipa
          ls -la ../LiveSoundAnalyzer-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSoundAnalyzer-iOS-unsigned-ipa
          path: LiveSoundAnalyzer-unsigned.ipa
      - name: Run in Simulator with demo signal and take a screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devs[k] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          APP=$(find build/Build/Products -name 'LiveSoundAnalyzer.app' -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.livesound.analyzer --demo
          sleep 15
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.livesound.analyzer  # still running?
          xcrun simctl io "$UDID" screenshot ../ios-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-screenshot.png

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional fixed signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/livesound.jks"
            echo "LIVESOUND_KEYSTORE=$RUNNER_TEMP/livesound.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: APK will be debug-signed."
          fi
      - name: Unit tests (engine) and screenshot renders
        env:
          LIVESOUND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIVESOUND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIVESOUND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ../LiveSoundAnalyzer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSoundAnalyzer-android-apk
          path: LiveSoundAnalyzer-android.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android 14 tablet emulator (demo mode) and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          working-directory: android
          script: |
            adb install -r ../LiveSoundAnalyzer-android.apk
            adb shell am start -n com.livesound.analyzer/.ui.MainActivity --ez demo true
            sleep 20
            adb shell pidof com.livesound.analyzer
            adb logcat -d -b crash > ../android-crash.log || true
            test ! -s ../android-crash.log
            adb exec-out screencap -p > ../android-emulator-screenshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshot
          path: |
            android-emulator-screenshot.png
            android-crash.log
            android/app/src/test/snapshots/images/*.png
          if-no-files-found: ignore
